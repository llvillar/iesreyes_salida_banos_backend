name: iesreyes-preproduccion

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ies_reyes
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - preproduccion_postgres_data:/var/lib/postgresql/data
      - ./db/01-inicializar.sql:/docker-entrypoint-initdb.d/01-inicializar.sql:ro
      - ./db:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/ies_reyes
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AUTH_INITIAL_PASSWORD: ${AUTH_INITIAL_PASSWORD:?Define AUTH_INITIAL_PASSWORD}
      AUTH_INITIAL_PROFESOR_DNI: ${AUTH_INITIAL_PROFESOR_DNI:?Define AUTH_INITIAL_PROFESOR_DNI}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  preproduccion_postgres_data:

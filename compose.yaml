services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ies_reyes
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/recrear-bbdd.sql:/docker-entrypoint-initdb.d/01-recrear-bbdd.sql:ro
      - ./db/recrear-bbdd.sql:/scripts/recrear-bbdd.sql:ro
      - ./db/migrar-bbdd-normalizada.sql:/scripts/migrar-bbdd-normalizada.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ies_reyes
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

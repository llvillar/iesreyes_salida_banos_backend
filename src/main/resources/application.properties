spring.application.name=ies-reyes

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ies_reyes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.auth.initial-password=${AUTH_INITIAL_PASSWORD:dev-catalogo-cambia}
app.auth.initial-profesor-dni=${AUTH_INITIAL_PROFESOR_DNI:00000001A}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.forward-headers-strategy=framework